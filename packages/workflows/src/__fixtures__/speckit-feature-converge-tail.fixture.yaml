name: speckit-feature
description: Test fixture mirroring the converge/PR tail of the deleted speckit-feature default.
provider: codex
nodes:
  - id: analyze-apply
    prompt: |
      $speckit-analyzebatch --apply --allow-historical-edits
    provider: claude
    effort: xhigh
    model: sonnet
    context: fresh

    skills: [speckit-analyzebatch]

  - id: ralph-tasks-to-ralph
    bash: |
      set -euo pipefail
      bash .specify/extensions/ralph-loop/scripts/bash/tasks-to-prd.sh
    depends_on:
      - analyze-apply
      - speckit-converge-review-gate
    trigger_rule: one_success

  - id: ralph-loop-run
    bash: |
      bash .specify/extensions/ralph-loop/ralph.sh
    depends_on:
      - ralph-tasks-to-ralph
    timeout: 86400000

  - id: ralph-sync-back
    prompt: |
      Read .specify/feature.json to resolve <feature_directory>, then run:
      /speckit.ralph-loop.sync-back <feature_directory>
    depends_on:
      - ralph-loop-run
    provider: codex
    effort: medium
    model: gpt-6-terra
    context: fresh

  - id: speckit-converge
    prompt: |
      Read .specify/feature.json to resolve <feature_directory>.
      run speckit-converge
      Return PASS only when there are no any problem.
      Return FAIL when it added one or more tasks to tasks.md .
    depends_on:
      - ralph-sync-back
    provider: codex
    effort: xhigh
    model: gpt-6-sol
    context: fresh
    output_format:
      type: object
      properties:
        gate:
          type: string
          enum: [PASS, FAIL]
        tasks_added:
          type: number
      required:
        - gate
        - tasks_added
    output_type: speckit-convergence

  # PASS → PR preparation; FAIL → reviewed Ralph retry; exhausted → one final Ralph pass → PR preparation.
  - id: speckit-converge-gate
    depends_on: [speckit-converge]
    route_loop:
      condition: "$speckit-converge.output.gate == 'PASS'"
      max_iterations: 3
      routes:
        positive: cargo-clean-before-pr
        negative: speckit-converge-review-gate
        exhausted: speckit-final-ralph-tasks-to-ralph

  - id: speckit-converge-review-gate
    plannotator_gate:
      prepare:
        prompt: |
          ## Goal
          Open the active feature's `tasks.md` directly in the supervised
          `speckit-converge-review-gate` session.

          Converge reported:
          - gate: $speckit-converge.output.gate
          - tasks_added: $speckit-converge.output.tasks_added

          ## Steps
          1. Read `.specify/feature.json` to resolve `<feature_directory>`.
          2. Confirm `<feature_directory>/tasks.md` exists, is a regular file, and is readable.
          3. Resolve it to an absolute path.
          4. Do not generate HTML and do not start a separate Plannotator session.
             The supervised gate opens the returned Markdown file.

          ## Final output (contract — required)
          Print only the absolute path to `<feature_directory>/tasks.md`.
          Do not add a Markdown fence or commentary.
        effort: medium
        provider: claude
        model: sonnet
        allowed_tools:
          - Read
          - Bash
      message: |
        Speckit convergence added $speckit-converge.output.tasks_added task(s) to `tasks.md`.

        Review the tasks added by this converge pass directly in `tasks.md`.
        - **Owner only:** Approve or Send Annotations.
        - Teammates may Close without ending the session (`--persist-session`).
        - After Approve: re-run `ralph-tasks-to-ralph` and the Ralph implementation loop.

        Crash recovery: `archon workflow review-open <run-id>` (then `resume` if needed).
      capture_response: true
      rework:
        prompt: |
          You are handling human Plannotator annotations on the tasks added by
          this `speckit-converge` pass.

          Markdown path under review: $REVIEW_DOCUMENT
          Annotations:
          $REVIEW_ANNOTATIONS

          Converge context: tasks_added=$speckit-converge.output.tasks_added

          ## Instructions
          1. Read `.specify/feature.json` for `<feature_directory>`.
          2. Confirm `$REVIEW_DOCUMENT` is that feature's `tasks.md`.
          3. Apply each actionable annotation directly to the new or related tasks.
          4. Preserve unrelated, pre-existing, and completed tasks.
          5. Treat a pure approval or acknowledgement as a no-op.
          6. Do not generate HTML and do not start another Plannotator session.
          7. Print only the absolute path to the updated `tasks.md`.
             Do not add a Markdown fence or commentary.

  - id: speckit-final-ralph-tasks-to-ralph
    bash: |
      set -euo pipefail
      bash .specify/extensions/ralph-loop/scripts/bash/tasks-to-prd.sh
    depends_on: [speckit-converge-gate]

  - id: speckit-final-ralph-loop-run
    bash: |
      bash .specify/extensions/ralph-loop/ralph.sh
    depends_on: [speckit-final-ralph-tasks-to-ralph]
    timeout: 86400000

  - id: speckit-final-ralph-sync-back
    prompt: |
      Read .specify/feature.json to resolve <feature_directory>, then run:
      /speckit.ralph-loop.sync-back <feature_directory>
    depends_on: [speckit-final-ralph-loop-run]
    provider: codex
    effort: medium
    model: gpt-6-terra
    context: fresh

  - id: cargo-clean-before-pr
    bash: |
      if [ -f Cargo.toml ]; then
        cargo clean
      fi
    depends_on: [speckit-converge-gate]

  - id: speckit-final-cargo-clean-before-pr
    bash: |
      if [ -f Cargo.toml ]; then
        cargo clean
      fi
    depends_on: [speckit-final-ralph-sync-back]

  - id: update-bmad-sprint-status
    prompt: |
      Read `.specify/feature.json` and the active feature's `spec.md` to identify the
      corresponding BMAD story.
      Read `_bmad-output/implementation-artifacts/sprint-status.yaml` completely.
      Match the feature to exactly one story under `development_status` by its story
      identifier and title, not only by its current status.
      If exactly one matching story is `backlog`, change only that status to `done`.
      If the matching story is already `done`, make no change and succeed.
      If the file is missing, the match is absent or ambiguous, or the matching story
      has any other status, stop with a clear error and do not modify the file.
      Verify the final status before completing.
    provider: codex
    effort: medium
    depends_on: [cargo-clean-before-pr, speckit-final-cargo-clean-before-pr]
    trigger_rule: one_success
    context: fresh
    model: gpt-6-terra

  - id: create-pull-request
    command: archon-create-pr
    provider: codex
    effort: medium
    depends_on: [update-bmad-sprint-status]
    context: fresh
    model: gpt-6-terra
    idle_timeout: 900000
    output_type: pull-request
