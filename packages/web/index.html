    />
    <title>Archon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Fira+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint to avoid a flash. Keep the rule
      // in step with resolveTheme() in src/lib/theme.ts. A storage failure
      // falls back to the system setting.
      (function () {
        var choice = 'system';
        try {
          var stored = localStorage.getItem('archon-theme');
          if (stored === 'light' || stored === 'dark') choice = stored;
        } catch (e) {
          /* storage blocked: use the system setting */
        }
        var dark =
          choice === 'dark' ||
          (choice === 'system' &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
    <style>
      html {
        background-color: #ffffff;
      }
      html.dark {
        background-color: #0b0b0f;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
