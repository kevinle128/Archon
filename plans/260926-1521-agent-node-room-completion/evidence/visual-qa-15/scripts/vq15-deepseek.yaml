name: vq15-deepseek
description: "Scratch - DeepSeek steering target."
mutates_checkout: false
nodes:
  - id: ds-node
    provider: deepseek
    model: alibaba/deepseek-v4.1-flash
    prompt: |
      Run these shell steps one at a time, each as its own separate tool call, in order: "sleep 25; echo s1", "sleep 25; echo s2", "sleep 25; echo s3", "sleep 25; echo s4".
      Then reply with one short line. If an operator message arrives, follow it exactly and include any ACK token it asks for.
      $ARGUMENTS
