name: vq15-fake-loop-fast
description: "Scratch - fake loop with 14 s iterations for boundary checks."
mutates_checkout: false
nodes:
  - id: fake-loop
    provider: e2e-fake
    model: e2e-fake-model
    loop:
      prompt: |
        <<E2E_SCENARIO>>{"interruptible":true,"emitTool":true,"delayMs":14000}<</E2E_SCENARIO>>
        iteration
      until: E2E_LOOP_DONE
      max_iterations: 12
