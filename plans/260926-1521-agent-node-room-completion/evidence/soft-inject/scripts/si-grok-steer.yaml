name: si-grok-steer
description: "Scratch - Grok ACP soft-injection target."
mutates_checkout: false
nodes:
  - id: grok-node
    provider: grok
    prompt: |
      Run these shell steps one at a time, each as its own separate tool call, in order: step N is "sleep 9; echo sN" for N = 1..5.
