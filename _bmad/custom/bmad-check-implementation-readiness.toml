[workflow]

activation_steps_prepend = [
  "Require an explicit target spec slug before document discovery. Resolve {output_folder}/specs/spec-{target_slug}/ and its canonical SPEC.md or PRD.md. If resolution fails, stop with INVALID_ASSESSMENT_INPUT.",
  "Before document discovery, inspect the selected Epic frontmatter and body for approved mockup or prototype references. If none are found, stop and ask the user whether approved mockups exist. Never infer that no mockup exists. If the user confirms none exist, record that answer and continue. If mockups exist, require their exact paths but do not interpret their contents in this readiness context before a validated mockup manifest exists.",
  "When approved Claude Design mockups exist, require a validated manifest at {output_folder}/planning-artifacts/mockup-manifests/{target_slug}.json. If it is missing, stop this readiness run and ask the user to start a fresh Codex context in the same checkout with {project-root}/.agents/skills/claude-design-feature-extractor/SKILL.md. That context must freeze the mockup inventory before it reads implementation, tests, PRD, Architecture, Epic, Story, issue, or pull-request claims. After the inventory is frozen, it must discover the current implementation, relevant tests, and completed Epics for classification.",
  "Run python3 \"{project-root}/.agents/skills/claude-design-feature-extractor/scripts/validate-mockup-manifest.py\" validate --root \"{project-root}\" --expected-target \"{target_slug}\" \"{output_folder}/planning-artifacts/mockup-manifests/{target_slug}.json\". Stop if validation fails, if an approved mockup source is absent, if the manifest lists a different approved source set, or if a recorded mockup, current-product, or completed-Epic section hash is stale. A shared Epic file may change outside its recorded completed-Epic section as current requirements and new Stories are corrected; do not demand re-extraction for that change. Regenerate the manifest in a fresh extractor context only when recorded evidence changed; never repair it from planning documents.",
  "Use the validated mockup manifest as the only source for the mockup side of the readiness comparison. Do not change its behavior values after reading PRD, Architecture, Epic, Story, README, implementation, issue, or pull-request claims.",
  "When approved mockups exist, copy the manifest change boundary, numbered CHANGE_FEATURE inventory, and UNCHANGED_CONTEXT inventory before using PRD, Architecture, Epic, Story, README reconciliation notes, or future labels. Do not rederive or repair the mockup behavior or change classification in the readiness context. Keep changed controls with the same label as separate items whenever their state, target, timing, scope, or result differs.",
  "Confirm that every manifest behavior field cites only a rendered mockup, executable interaction code, explicit mockup annotation, or direct user answer. Never accept PRD, Architecture, Epic, Story, README, reconciliation, issue, pull-request, or implementation evidence on the mockup side.",
  "Before document mapping, copy every CHANGE_FEATURE row and its field-level evidence into the Mockup Behavior Evidence Ledger. Copy every UNCHANGED_CONTEXT row into a separate Context Inventory with its implementation and completed-Epic comparison evidence. Do not require unchanged context to be re-specified as a new feature in the current target. A control's existence, visible label, placement, or availability proves only those observable facts; it does not prove its target, target cardinality, collection mutation, effect on active work, or next state.",
  "If any behavior field is UNKNOWN, any feature is UNCLEAR, or any action identity group is UNCLEAR, stop and require the fresh extractor context to ask the user one focused question and regenerate the manifest. Do not answer the question from planning or historical documents.",
  "Before document mapping, copy the manifest Action Identity Audit. Keep controls grouped by their normalized action key and preserve every recorded behavior difference, decision, and evidence without reinterpretation.",
  "Treat every scope label such as future, post-v1, later, deferred, gated, optional, stretch, removed, superseded, or out of scope as a conflict when it applies to a feature that remains visible in an approved mockup. A user scope change is valid only after the approved mockup is updated. Determine applicability from the frozen mockup inventory; do not ask the user to remember which elements changed.",
]

persistent_facts = [
  "Before reporting a cross-document conflict, quote both claims with section references and classify each as a normative constraint, maximum or minimum, first runnable target, default or example, runtime capability, or projection/view mode.",
  "A cross-document conflict is a defect only when the claims are normative and mutually exclusive; first attempt to describe one implementation that satisfies both.",
  "Differences across runtime structure, projection/view state, implementation milestones, defaults, and examples are not conflicts unless the documents explicitly bind them to incompatible outcomes.",
  "If wording is ambiguous but mutual exclusion is not proven, record a warning or clarification request without incrementing issue counts or downgrading readiness.",
  "Before downgrading readiness, document the reconciliation attempt and the evidence that disproves it.",
  "The requested target spec folder is the authoritative assessment boundary.",
  "A validated Claude Design feature manifest is required whenever approved Claude Design mockups exist. Its mockup sources must exactly match the approved source set. Its comparison sources must include the current implementation or tests and completed Epics. Every recorded hash must still be current within its recorded scope; adding or correcting current Epic requirements outside a completed-Epic section does not stale that section.",
  "Read the target epics frontmatter inputDocuments before recommending an assessment document set.",
  "Never select a generic root-level PRD, architecture, UX, or epics file unless its frontmatter explicitly belongs to the requested target.",
  "All selected source documents must share the same target lineage.",
  "If requirements and epics describe different product scopes, classify the run as INVALID_ASSESSMENT_INPUT, return to document discovery, and do not calculate coverage, issue counts, or readiness status.",
  "When approved mockups exist, freeze every visible product control, state, transition, and behavior in a mockup-only inventory. Then compare every inventory item with the current implementation or tests and completed Epics. Classify each inventory item exactly once as CHANGE_FEATURE or UNCHANGED_CONTEXT, with direct evidence from both baseline kinds.",
  "Every visible control, state, transition, and behavior in an approved mockup is current implementation scope. Approved mockups never contain future product features.",
  "Current product scope is not the same as current change coverage. CHANGE_FEATURE rows are additions or changes that the selected PRD, Architecture, Epic, and Story must specify. UNCHANGED_CONTEXT rows are existing current behavior shown for screen context and must not be forced into the new Epic as newly requested work.",
  "Never assign or accept a future, post-v1, later, deferred, gated, optional, stretch, removed, superseded, or out-of-scope label for a feature that remains visible in an approved mockup. An explicit user scope change must update the approved mockup first.",
  "A document label, absence from a mockup, technical uncertainty, an unverified provider capability, or an incomplete implementation is not evidence that work is future or out of scope.",
  "A mockup shows product behavior and does not need to show its internal implementation mechanism. Every mechanism required to deliver a visible behavior is current scope with that behavior. A different mechanism is acceptable only when it still delivers the complete approved behavior.",
  "All changes are defined by differences between the approved mockup inventory and the current product plus completed Epics. Never ask the user to remember or classify which controls changed. If classification evidence is incomplete, inspect more implementation, tests, current-product states, and completed Epic text; do not guess or omit the item.",
  "Create a Mockup Feature Behavior Matrix with one row per atomic CHANGE_FEATURE behavior. Each row must contain a stable feature ID, exact mockup file and location, visible control or state, precondition, user action, affected item or items, delivery or transition timing, expected result, remaining state, exact PRD requirement, exact Architecture decision, exact Epic or Story acceptance criterion, and comparison status.",
  "The behavior signature for an interactive control is its visible label and location, availability precondition, trigger, target identity, target cardinality, timing, effect on active work, queue or collection mutation, expected result, and remaining or next state.",
  "Populate the mockup side of every behavior signature before reading planning-document claims about that behavior. A planning document must never supply missing mockup semantics.",
  "Every populated mockup behavior-signature field must carry field-level provenance to an exact rendered element, executable interaction, explicit annotation, or direct user answer. A row-level mockup filename or broad state citation is not field-level provenance.",
  "Separate visible controls prove that separate controls exist. They do not prove that both complete behavior signatures are approved, and they do not prove what either control sends, mutates, interrupts, preserves, or transitions to.",
  "If the rendered mockup and its interaction code do not prove a control's target, cardinality, timing, effect, or next state, mark the behavior UNCLEAR and ask the user one focused question before continuing. Do not guess from a familiar label.",
  "If one source proves a per-item action but another control with the same label has no direct evidence for whether it affects a draft, one queued item, multiple queued items, or every queued item, keep the second control's target and cardinality UNKNOWN. Ask the user; do not copy semantics from a planning document or from the proven per-item action.",
  "Use only these comparison statuses: MATCHED, PARTIAL, MISSING, CONFLICT, and UNCLEAR.",
  "Mark a row MATCHED only when the precondition, user action, affected item or items, timing, expected result, and remaining state are equivalent in the mockup, PRD, Architecture, and Epic or Story. A shared feature name, nearby reference, broad capability, or link is not evidence of equivalent behavior.",
  "Use PARTIAL only when a required behavior field is absent and no source gives it an incompatible value. Use CONFLICT whenever any source assigns an incompatible precondition, target, cardinality, timing, effect, collection mutation, result, or next state.",
  "Map every CHANGE_FEATURE item to an explicit PRD requirement, Architecture decision, and Epic or Story acceptance criterion, and quote or precisely cite the clauses that implement the complete behavior. Do not require UNCHANGED_CONTEXT items to appear as new requirements in the current target. Never merge separate matrix rows only because they use the same label or control family.",
  "After creating separate matrix rows, group them again by visible label and user intent and compare them across rows. Separate rows do not make incompatible meanings compatible.",
  "A per-item action that affects one selected object is not equivalent to a shared action that affects every eligible object. A difference in target cardinality is a CONFLICT unless the approved mockup or an explicit user decision proves that both actions are distinct current features.",
  "A control that acts during active work is not equivalent to a control that acts only after active work stops. A difference in timing or effect on active work is a CONFLICT unless the approved mockup or an explicit user decision proves that both actions are distinct current features.",
  "Do not reconcile mutually exclusive claims by proposing an implementation that includes both actions. First prove from the approved mockup or an explicit user decision that both actions are intended.",
  "Treat visible product words as part of the contract. An internal term such as delete, withdraw, cancel, abort, or continue may differ from the visible label only when the artifacts define an explicit mapping and preserve the same target, cardinality, timing, effect, and result. Otherwise mark CONFLICT or ask the user if intent is unclear.",
  "A planning document, decision record, handoff note, backlog gate, milestone label, or historical owner-decision entry cannot remove, defer, or downgrade a feature that remains visible in an approved mockup.",
  "If PRD, Architecture, Epic, Story, or any supporting document labels a visible mockup behavior as future, post-v1, gated, deferred, removed, superseded, or out of scope, mark the matrix row CONFLICT.",
  "If a CHANGE_FEATURE behavior remains unclear after mockup rendering and interaction-code review, stop and ask the user one focused behavior question. Do not infer, omit, rename, defer, or reinterpret it.",
  "If the product decision changes, the approved mockup must be updated first. Until the mockup, PRD, Architecture, and Epic or Story all describe the same current behavior, implementation readiness remains NOT READY.",
  "Before the final assessment, create a Scope Decision Audit for every future, post-v1, later, deferred, gated, optional, stretch, removed, superseded, or out-of-scope label in the selected artifacts. If the label applies to a feature that remains visible in an approved mockup, mark CONFLICT. For any other label, require an explicit user decision; if it is missing, stop and ask the user.",
  "Before the final assessment, include an Action Identity Audit table. Each row must name the grouped feature IDs, the shared visible label or intent, every distinct behavior signature, the evidence that proves the signatures are both intended or conflicting, and the audit result.",
  "The evidence column in the Action Identity Audit must cite field-level mockup or user provenance for every difference between grouped signatures. Planning-document citations may show alignment or conflict only after the mockup behavior is proven; they cannot prove that two mockup behaviors are both intended.",
  "Include the complete Mockup Behavior Evidence Ledger and Context Inventory in the readiness report. For each CHANGE_FEATURE ID, show separate provenance for precondition, action, target identity, target cardinality, timing, effect on active work, collection mutation, expected result, and remaining or next state; a single row-level mockup citation is insufficient. For each CHANGE_FEATURE and UNCHANGED_CONTEXT ID, show the implementation and completed-Epic evidence that proves its classification.",
  "Before the final assessment, include the complete Mockup Feature Behavior Matrix in the readiness report and calculate mockup coverage from its atomic rows. Do not replace the matrix with a prose summary or a broad feature mapping table.",
  "The matrix must keep separate columns for mockup precondition, action, target and cardinality, timing, effect or result, and remaining or next state. A prose summary that compresses these fields into one cell does not satisfy the gate.",
  "Implementation readiness is NOT READY while any CHANGE_FEATURE matrix row is PARTIAL, MISSING, CONFLICT, or UNCLEAR, while any CHANGE_FEATURE row lacks an exact PRD, Architecture, and Epic or Story citation, while any visible element lacks exactly one proven CHANGE_FEATURE or UNCHANGED_CONTEXT classification, or while any changed-feature behavior question awaits a user answer.",
]

on_complete = """
Before exiting, reopen the completed report and run the Change Boundary, Context Inventory, and Action Identity audits again against the immutable mockup manifest.
When a Claude Design feature manifest was used, run its validator again and stop if a recorded source or completed-Epic section hash changed or the manifest became invalid.
Do not stop merely because current Epic requirements or new Stories outside the recorded completed-Epic section changed; assess those changes in this readiness run.
Confirm that the mockup columns were derived before and independently from PRD, Architecture, Epic, Story, README, and reconciliation claims.
Require field-level provenance for every populated CHANGE_FEATURE precondition, action, target, cardinality, timing, effect, collection mutation, result, and remaining or next state.
Require current-implementation or test evidence and completed-Epic evidence for every CHANGE_FEATURE and UNCHANGED_CONTEXT classification, and do not require unchanged context to be re-specified as new work in the current target.
Treat a visible control's existence, label, placement, and availability as evidence only for those observable facts, never as evidence for hidden target, cardinality, mutation, delivery, interruption, or transition semantics.
If a field lacks exact mockup or user provenance, replace its value with UNKNOWN, mark the row UNCLEAR, and stop to ask the user before issuing the final assessment.
Confirm that the matrix has separate columns for precondition, action, target and cardinality, timing, effect or result, and remaining or next state.
Group every matrix row by visible label and user intent, then compare every behavior-signature field across the grouped rows.
Do not accept separate rows as proof that incompatible meanings are distinct features.
Do not accept the existence of two controls as proof that their complete behavior signatures are both approved.
Do not use a PRD, Architecture, Epic, Story, README, reconciliation note, or historical decision as provenance for the mockup side of a behavior signature.
If one action affects one selected item and another affects multiple or all items, require mockup evidence or an explicit user decision that both are intended; otherwise mark CONFLICT or stop and ask the user when intent is unclear.
If one action occurs during active work and another occurs only after active work stops, require the same evidence; otherwise mark CONFLICT or stop and ask the user when intent is unclear.
Audit visible labels and internal terms such as delete, withdraw, cancel, abort, and continue for an explicit behavior-preserving mapping.
Use PARTIAL only for absent information and CONFLICT for incompatible information.
If this audit changes any finding, update the matrix row, Action Identity Audit, counts, critical issues, recommendations, and readiness verdict before presenting completion.
Do not finish until every Action Identity Audit group is MATCHED or has an explicit non-MATCHED finding, and every unclear behavior has been answered by the user.
"""
