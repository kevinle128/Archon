<script type="module">
import { exportToBlob } from "https://esm.sh/@excalidraw/excalidraw@0.17.6";
const scene = JSON.parse(document.getElementById('scene').textContent);
(async()=>{
  try{
    const blob = await exportToBlob({
      elements: scene.elements,
      files: scene.files||{},
      mimeType: 'image/png',
      appState: { ...(scene.appState||{}), exportBackground:true, viewBackgroundColor:'#ffffff', exportPadding:24, exportWithDarkMode:false },
      getDimensions:(w,h)=>({width:w*2,height:h*2,scale:2})
    });
    const buf = new Uint8Array(await blob.arrayBuffer());
    let bin=''; for(let i=0;i<buf.length;i++) bin+=String.fromCharCode(buf[i]);
    window.__png = btoa(bin); window.__done=true;
  }catch(e){ window.__err = (e&&e.stack)||String(e); window.__done=true; }
})();
</script></body></html>
