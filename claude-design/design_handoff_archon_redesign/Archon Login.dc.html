<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/modernist-e24aa044-ad6a-428b-b2d0-5369bdd0a859/styles.css">
  <script src="_ds/modernist-e24aa044-ad6a-428b-b2d0-5369bdd0a859/_ds_bundle.js"></script>
  <style>
    html, body { margin: 0; height: 100%; }
    button { font: inherit; color: inherit; }
    a { color: #2563eb; } a:hover { color: #1d4ed8; }
  </style>
</helmet>
<div style="min-height: 100vh; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); font-family: var(--font-body); --color-bg: #f5f7fa; --color-surface: #eaeef3; --color-text: #1a2130; --color-divider: #e2e6ed; --color-accent: #2563eb; --color-accent-600: #1d4ed8; background: #f5f7fa; color: #1a2130;">
  <div style="display: flex; flex-direction: column; justify-content: space-between; gap: var(--space-8); padding: var(--space-8); background: #1a2130; color: #f1f4f9;">
    <div style="display: flex; align-items: center; gap: var(--space-2);"><svg viewBox="0 0 64 64" width="28" height="28" shape-rendering="crispEdges" fill="currentColor" aria-hidden="true" style="display: block;"><rect x="20" y="4" width="24" height="8"></rect><rect x="12" y="12" width="16" height="8"></rect><rect x="36" y="12" width="16" height="8"></rect><rect x="4" y="20" width="16" height="8"></rect><rect x="44" y="20" width="16" height="8"></rect><rect x="4" y="28" width="56" height="8"></rect><rect x="4" y="36" width="16" height="24"></rect><rect x="44" y="36" width="16" height="24"></rect></svg><span style="font-family: var(--font-heading); font-weight: 800; font-size: 22px;">Archon</span></div>
    <div style="max-width: 18ch; font-family: var(--font-heading); font-weight: 800; font-size: 44px; line-height: 1.05; text-wrap: balance;">Run coding agents as workflows you can watch.</div>
    <div style="display: flex; gap: 2px; max-width: 360px;">
      <span style="flex: 1; height: 6px; background: #16a34a;"></span><span style="flex: 1; height: 6px; background: #16a34a;"></span><span style="flex: 1; height: 6px; background: #2563eb;"></span><span style="flex: 1; height: 6px; background: #d97706;"></span><span style="flex: 1; height: 6px; background: #3a4558;"></span><span style="flex: 1; height: 6px; background: #3a4558;"></span>
    </div>
  </div>

  <div style="display: flex; align-items: center; padding: var(--space-8);">
    <form onSubmit="{{ submit }}" style="width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: var(--space-4);">
      <div>
        <div style="font-family: var(--font-heading); font-weight: 800; font-size: 28px;">{{ title }}</div>
        <div style="font-size: 14px; color: #5a6478; margin-top: var(--space-1); line-height: 1.5;">{{ sub }}</div>
      </div>
      <div style="height: 2px; background: #1a2130;"></div>
      <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: #5a6478;">Email
        <input class="input" type="email" autocomplete="email" value="{{ email }}" onChange="{{ setEmail }}" placeholder="you@company.com" style="min-height: 40px; font-size: 15px; background: #ffffff;">
      </label>
      <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: #5a6478;">Password
        <input class="input" type="password" autocomplete="current-password" value="{{ pw }}" onChange="{{ setPw }}" placeholder="{{ pwPh }}" style="min-height: 40px; font-size: 15px; background: #ffffff;">
      </label>
      <sc-if value="{{ hasErr }}" hint-placeholder-val="{{ false }}"><div style="font-size: 13px; font-weight: 600; color: #dc2626;">{{ err }}</div></sc-if>
      <button type="submit" class="btn btn-primary" style="min-height: 44px; justify-content: space-between; background: #2563eb; border-color: #2563eb; color: #ffffff; font-size: 15px;"><span>{{ cta }}</span><span>→</span></button>
      <button type="button" onClick="{{ toggle }}" style="align-self: flex-start; padding: 0; border: 0; background: none; font-size: 13px; font-weight: 600; color: #2563eb; cursor: pointer;">{{ switchText }}</button>
    </form>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { mode: 'login', email: '', pw: '', err: '', busy: false };
  renderVals() {
    const s = this.state, up = s.mode === 'signup';
    const submit = e => {
      if (e && e.preventDefault) e.preventDefault();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(s.email)) return this.setState({ err: 'Enter a valid email.' });
      if (up && s.pw.length < 8) return this.setState({ err: 'Use at least 8 characters.' });
      if (!s.pw) return this.setState({ err: 'Enter your password.' });
      this.setState({ err: '', busy: true });
      setTimeout(() => { window.location.href = 'Archon%20Runs%20Workspace.dc.html'; }, 400);
    };
    return {
      title: up ? 'Create your account' : 'Sign in', sub: up ? 'Signup is invite-only. Use an allowlisted email.' : 'Sign in to your Archon workspace.',
      cta: s.busy ? 'Signing in…' : up ? 'Create account' : 'Sign in', switchText: up ? 'Already have an account? Sign in' : 'No account yet? Sign up',
      pwPh: up ? 'At least 8 characters' : '', email: s.email, pw: s.pw, setEmail: e => this.setState({ email: e.target.value, err: '' }), setPw: e => this.setState({ pw: e.target.value, err: '' }),
      hasErr: !!s.err, err: s.err, submit, toggle: () => this.setState({ mode: up ? 'login' : 'signup', err: '' })
    };
  }
}
</script>
</body>
</html>
