name: archon-superpower-feature-verify-loop
description: |
  Use when: Manual Superpowers brainstorming is complete and the user wants the
            feature built, then proved with project-local verify-archon before
            any pull request.
  Triggers: "superpower feature verify", "superpower verify loop",
            "archon-superpower-feature-verify-loop".
  Does: Same early Superpowers pipeline as superpower-feature (plan → Codex plan
        repair → Ralph PRD → in-parent Ralph implement, no PR). Then proposes
        affected behaviors and deterministically normalizes, executes, and checks
        the shared verification contract. Failures run a max-3 fix, commit,
        reselect, and re-prove route_loop. Only current-HEAD executable PASS opens
        a PR naming behaviors, scenarios, and evidence. Exhaustion writes a blocked report and stops
        with a non-zero exit — it does not open a green PR.
  NOT for: Brainstorming itself, verify-only without implementation, Mini/PM2/
        Tailscale proofs, or review-only work. Never start or stop Oceanlabs Mini.
  Input: The approved brainstorm result, product notes, design spec path, or
         requirements from the manual Superpowers brainstorming step. Run from
         the anhle128/Archon checkout that contains the project-local verification
         catalog and deterministic helper under `.agents/skills/verify-archon/`.
provider: omp
model: 'xai-oauth/grok-4.6'
effort: high
tags:
  - Superpowers
  - Feature
  - TDD
  - Verify

nodes:
  - id: setup
    description: Prepare Superpowers + verify-archon artifacts and preflight the helper.
    bash: |
      set -euo pipefail
      if [ -n "$(git status --porcelain)" ]; then
        echo "ERROR: start from a clean worktree; preserve existing user changes." >&2
        exit 1
      fi
      mkdir -p "$ARTIFACTS_DIR/superpowers/plans" "$ARTIFACTS_DIR/verify"
      git rev-parse HEAD > "$ARTIFACTS_DIR/superpowers/base-sha.txt"
      {
        echo "Archon Superpowers feature + verify-archon loop"
        echo "Base SHA: $(cat "$ARTIFACTS_DIR/superpowers/base-sha.txt")"
        echo "Brainstorming is manual and must already be complete."
        echo "Local bun verify only. Never Mini / PM2 / Tailscale."
      } > "$ARTIFACTS_DIR/superpowers/setup.md"

      VERIFY_BIN=".agents/skills/verify-archon/bin/verify-archon"
      if [ ! -f "$VERIFY_BIN" ]; then
        echo "ERROR: $VERIFY_BIN is missing." >&2
        echo "Run this workflow from anhle128/Archon after verify-archon landed on develop." >&2
        exit 1
      fi
      test -x "$VERIFY_BIN"
      test -f ".archon/scripts/verify-feature-gate.ts"
      "$VERIFY_BIN" catalog --json > "$ARTIFACTS_DIR/verify/catalog.json"
      printf '%s\n' "$VERIFY_BIN" > "$ARTIFACTS_DIR/verify/helper-path.txt"
      echo "VERIFY_BIN=$VERIFY_BIN"

  - id: write-plan
    description: Write the Superpowers implementation plan with Grok 4.6.
    provider: claude
    model: 'opus'
    effort: xhigh
    context: fresh
    skills:
      - writing-plans
    depends_on:
      - setup
    prompt: |
      Follow writing-plans.
      User input: $ARGUMENTS
      Override the skill's default plan location: write only
      $ARTIFACTS_DIR/superpowers/plans/YYYY-MM-DD-<feature>.md.
      Return its absolute path. Do not commit planning artifacts.
      Return only JSON.
    output_format:
      type: object
      required:
        - plan_path
        - task_count
        - summary
        - open_questions_count
        - validation_commands
      properties:
        plan_path:
          type: string
        task_count:
          type: number
        summary:
          type: string
        open_questions_count:
          type: number
        validation_commands:
          type: string

  - id: review-fix-plan
    description: Review and repair the plan directly with Codex.
    provider: codex
    model: gpt-6-sol
    effort: xhigh
    context: fresh
    depends_on:
      - write-plan
    prompt: |
      $writing-plans
      Repair the plan in place. Do not implement code.
      Plan: $write-plan.output.plan_path
      User input: $ARGUMENTS
      Return only JSON.
    output_format:
      type: object
      required:
        - plan_path
        - verdict
        - fixes_count
        - open_questions_count
        - review_report
        - summary
      properties:
        plan_path:
          type: string
        verdict:
          type: string
          enum:
            - clean
            - fixed-with-changes
            - needs-human-decision
        fixes_count:
          type: number
        open_questions_count:
          type: number
        review_report:
          type: string
        summary:
          type: string

  - id: build-ralph-prd
    description: Convert the Superpowers plan into a co-located Ralph PRD.
    depends_on:
      - review-fix-plan
    provider: omp
    model: cursor/composer-2.5
    effort: high
    context: fresh
    prompt: |
      Convert the Superpowers plan into a Ralph PRD. Do not implement.
      Plan: $review-fix-plan.output.plan_path
      Write $ARTIFACTS_DIR/superpowers/ralph/<plan-filename-without-md>/{prd.md,prd.json}
      (stories passes:false, same schema as superpower-feature).
      prd_dir must be an absolute realpath. Return only JSON.
    output_format:
      type: object
      properties:
        prd_dir:
          type: string
        slug:
          type: string
        feature:
          type: string
        story_count:
          type: number
      required: [prd_dir, slug, story_count]

  - id: validate-prd
    description: Record PRD dir and confirm prd.json is ready for Ralph.
    depends_on:
      - build-ralph-prd
    bash: |
      set -euo pipefail
      PRD_DIR=$build-ralph-prd.output.prd_dir
      if [ -z "$PRD_DIR" ] || [ ! -f "$PRD_DIR/prd.json" ]; then
        echo "ERROR: no prd.json in build-ralph-prd prd_dir ('$PRD_DIR')." >&2
        exit 1
      fi
      if [ ! -f "$PRD_DIR/prd.md" ]; then
        echo "ERROR: prd.md not found in $PRD_DIR" >&2
        exit 1
      fi
      mkdir -p "$ARTIFACTS_DIR/superpowers"
      printf '%s\n' "$PRD_DIR" > "$ARTIFACTS_DIR/superpowers/prd-dir.txt"
      echo "PRD_DIR=$PRD_DIR"
      echo "BRANCH=$(git branch --show-current)"
      TOTAL=$(jq '.userStories | length' "$PRD_DIR/prd.json")
      DONE=$(jq '[.userStories[] | select(.passes == true)] | length' "$PRD_DIR/prd.json")
      echo "STORIES_TOTAL=$TOTAL"
      echo "STORIES_DONE=$DONE"
      echo "STORIES_REMAINING=$((TOTAL - DONE))"

  - id: ralph-loop-run
    description: In-parent project-aware Ralph loop (no PR until verify-archon passes).
    depends_on:
      - validate-prd
    idle_timeout: 3600000
    provider: omp
    effort: high
    model: cursor/cursor-grok-4.6
    output_format:
      type: object
      properties:
        done:
          type: boolean
          description: true ONLY when every story in prd.json has passes true; false otherwise.
        mode:
          type: string
        story_id:
          type: string
        note:
          type: string
      required:
        - done
    loop:
      command: archon-ralph-project-aware-iteration
      fresh_context: true
      max_iterations: 35
      until_bash: |
        set -euo pipefail
        PRD_FILE="$ARTIFACTS_DIR/superpowers/prd-dir.txt"
        [ -f "$PRD_FILE" ] || exit 1
        PRD_DIR=$(cat "$PRD_FILE")
        [ -n "$PRD_DIR" ] && [ -f "$PRD_DIR/prd.json" ] || exit 1
        jq -e '.userStories | type == "array" and length > 0 and all(.[]; .passes == true)' "$PRD_DIR/prd.json" >/dev/null

  - id: begin-verify
    description: Start a fresh attempt before finalization can fail; never reuse an old PASS.
    depends_on:
      - ralph-loop-run
      - fix-verify
    trigger_rule: one_success
    always_run: true
    bash: |
      set -euo pipefail
      bun .archon/scripts/verify-feature-gate.ts begin
    timeout: 60000

  - id: finalize-change
    description: Validate and commit the intended change before selecting commit-bound proof.
    depends_on:
      - begin-verify
    provider: codex
    model: gpt-6-sol
    effort: xhigh
    context: fresh
    always_run: true
    idle_timeout: 3600000
    prompt: |
      Finalize only this workflow's intended changes. Do not open or push a PR.
      Plan: $review-fix-plan.output.plan_path
      Original base: $ARTIFACTS_DIR/superpowers/base-sha.txt
      Read git status and the full diff. The workflow started from a clean checkout.
      Run bun run validate and resolve failures before committing.
      Stage explicit intended source/test paths only; never git add -A,
      git add ., or git add -u. Do not commit logs, reports, scratch files, or
      anything under ARTIFACTS_DIR (including plan/PRD/progress files).
      Do not reset/stash unrelated edits.
      Commit the intended changes. Leave the product checkout clean.
      If validation or attribution cannot be resolved, report the blocker;
      the following deterministic snapshot will not accept a dirty checkout.
      Write the validation/commit summary under $ARTIFACTS_DIR/verify/.

  - id: prepare-verify
    description: Capture the original-base/current-HEAD snapshot and install locked proof dependencies.
    depends_on:
      - finalize-change
    always_run: true
    bash: |
      set -euo pipefail
      bun .archon/scripts/verify-feature-gate.ts prepare
      bun install --frozen-lockfile >&2
      npm ci --prefix e2e --no-audit --no-fund >&2
      if [ -z "${ARCHON_PW_CHANNEL:-}" ]; then
        node e2e/node_modules/@playwright/test/cli.js install chromium >&2
      fi
    timeout: 600000

  - id: select-verify-targets
    description: Propose all affected behaviors from the complete plan, request, and current diff.
    depends_on:
      - prepare-verify
    provider: grok
    model: grok-4.6
    effort: xhigh
    context: fresh
    always_run: true
    skills:
      - select-verify-archon-targets
    prompt: |
      Follow select-verify-archon-targets. Use only its Proposal Contract.
      The following deterministic node performs normalization; do not write
      selection, execution, result, or gate artifacts yourself.
      Plan: $review-fix-plan.output.plan_path
      User input: $ARGUMENTS
      Read $ARTIFACTS_DIR/verify/current.json and that attempt's snapshot.json.
      Use its exact base_sha, head_sha, and every changed_path. Read the full
      base..head diff and the current verify-archon JSON catalog.
      Read the full plan from disk. Include every affected behavior with evidence
      for confidence; medium/low broadens to the complete feature.
      Record uncovered behaviors in coverage_gaps. Never substitute a smoke or
      omit files to make normalization succeed. Do not mutate the checkout.
      Return only the proposal JSON matching output_format.
    output_format:
      type: object
      additionalProperties: false
      required: [version, base_sha, head_sha, changed_paths, affected_behaviors, coverage_gaps]
      properties:
        version:
          type: integer
          enum: [1]
        base_sha:
          type: string
        head_sha:
          type: string
        changed_paths:
          type: array
          items:
            type: string
        affected_behaviors:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [id, confidence, rationale]
            properties:
              id:
                type: string
              confidence:
                type: string
                enum: [high, medium, low]
              rationale:
                type: string
        coverage_gaps:
          type: array
          items:
            type: string

  - id: normalize-verify-targets
    description: Validate the proposal against the anchored snapshot, catalog, and runnable scenarios.
    depends_on:
      - select-verify-targets
    always_run: true
    bash: |
      set -euo pipefail
      PROPOSAL=$select-verify-targets.output
      printf '%s\n' "$PROPOSAL" | bun .archon/scripts/verify-feature-gate.ts normalize
    timeout: 180000

  - id: prove
    description: Execute the same runner as verify-archon prove --selection; no AI verdict.
    depends_on:
      - normalize-verify-targets
    always_run: true
    bash: |
      set -euo pipefail
      bun .archon/scripts/verify-feature-gate.ts prove
    timeout: 7200000

  - id: record-verify
    description: Read this attempt's result.json and check completeness, selection, tooling, and current HEAD.
    depends_on:
      - prove
    trigger_rule: all_done
    always_run: true
    bash: |
      set -euo pipefail
      bun .archon/scripts/verify-feature-gate.ts record $begin-verify.output
    timeout: 60000

  - id: verify-gate
    description: Current proof PASS permits PR; FAIL fixes and reselects up to three times.
    depends_on:
      - record-verify
    route_loop:
      condition: "$record-verify.output == 'true'"
      max_iterations: 3
      routes:
        positive: authorize-pr
        negative: fix-verify
        exhausted: verify-blocked

  - id: fix-verify
    description: Diagnose failing behaviors; every fix goes back through commit, selection, and proof.
    provider: omp
    model: cursor/gpt-6-sol
    effort: xhigh
    context: fresh
    idle_timeout: 3600000
    skills:
      - systematic-debugging
      - verification-before-completion
    prompt: |
      Follow systematic-debugging and verification-before-completion.
      Read $ARTIFACTS_DIR/verify/gate.json, report.md, and the current attempt
      referenced by current.json. Read proposal/normalization/execution evidence
      when a stage did not finish. Plan: $review-fix-plan.output.plan_path
      Fix the product defect or genuine verification drift, not the verdict.
      Add missing behavior/scenario coverage when needed. Never remove required
      scenarios, weaken assertions, skip unsupported proof, or mark flaky tests
      passing. Missing authenticated setup is a prerequisite, not a product bug.
      Do not edit proof/selection/gate artifacts. No PR or push. No Mini.
      Write $ARTIFACTS_DIR/verify/fix-report.md.
      The next path commits the fix, rereads the original-base/current-HEAD diff,
      selects again, and executes new proof. An old PASS is never reused.

  - id: authorize-pr
    description: Refuse stale, dirty, incomplete, or unsupported proof immediately before the PR node.
    depends_on:
      - verify-gate
    always_run: true
    bash: |
      set -euo pipefail
      bun .archon/scripts/verify-feature-gate.ts assert-pass $begin-verify.output
    timeout: 60000

  - id: create-pull-request
    description: Create a PR for the already-verified commit without changing it.
    command: archon-create-pr
    provider: omp
    model: cursor/composer-2.5
    effort: high
    context: fresh
    idle_timeout: 900000
    depends_on:
      - authorize-pr
    output_type: pull-request
    prompt_suffix: |
      This workflow requires the exact verified HEAD. Override the command's
      dirty-tree commit and push-conflict recovery steps: never commit, edit
      source/tests, rebase, merge, reset, or otherwise change HEAD here.
      Run bun .archon/scripts/verify-feature-gate.ts assert-pass $begin-verify.output immediately
      before push and again before creating or editing the pull request. If either fails, stop.
      Do not claim an older proof covers a new commit.
      Override issue-based existing-PR reuse too: never edit or return an existing
      PR solely because it mentions this issue. Resolve the intended head repository
      and branch from this checkout's push remote and branch. Only reuse an open PR
      with that exact head repository and branch. A PR on another head is a blocker.
      Never return or reuse any existing PR until its headRefOid equals gate.head_sha,
      even when no title/body edit is needed. If the intended branch lags, push the
      exact verified HEAD first and then recheck the PR's headRefOid.
      Push only the verified HEAD to that intended branch, without force. After
      push, check the remote branch SHA equals gate.head_sha. Before any PR edit,
      check gh pr view --json headRefOid,headRefName,headRepository,headRepositoryOwner
      matches the verified SHA and intended head repository/branch. Stop on mismatch.
      Use the repository PR template and issue closing link. Include the exact
      head_sha, behavior_ids, scenario_ids, result_path, and actual failures or
      limitations from $ARTIFACTS_DIR/verify/gate.json and report.md.
      Keep PR-body artifacts under ARTIFACTS_DIR, never in the source diff.

  - id: verify-blocked
    description: Exhausted fix budget writes current evidence and stops with no PR.
    depends_on:
      - verify-gate
    bash: |
      set -euo pipefail
      bun .archon/scripts/verify-feature-gate.ts blocked $begin-verify.output
    timeout: 60000
