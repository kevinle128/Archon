name: omb-fork-upstream-sync
description: |
  Use when: The nightly launchd job (scripts/fork-sync-trigger.sh omb) starts it through the Archon
            REST API for the codebase kevinle128/OpenMausBot. A run message of `dry-run` stops after
            the merge classification and changes nothing.
  Does: Syncs the OpenMausBot fork with milind-soni/OpenMausBot main (fork-upstream-sync-body):
        ends as a no-op when upstream has nothing new and the fork has no unreleased commit; a
        clean merge goes through a pull request, waits for all CI checks and is merged by Archon
        with a merge commit; a conflict, a failed local check or a red CI opens the one
        upstream-sync-conflict issue and runs omb-fork-upstream-resolve as a child run. When the
        pull request is merged, the workflows that upstream added are disabled (only CI,
        ci-stop-closed and fork-* stay on) and fork-desktop-build.yml starts with publish=true.
        An open upstream-sync-conflict issue pauses the sync until a human closes it.
  NOT for: Other repositories, or starting a build without a merge.

nodes:
  - id: sync
    include: fork-upstream-sync-body
    with:
      upstream_repo: milind-soni/OpenMausBot
      upstream_branch: main
      fork_repo: kevinle128/OpenMausBot
      build_workflow: fork-desktop-build.yml
      build_inputs: publish=true
      release_tag_glob: mf-desktop-v*
      workflow_allowlist: ci.yml,ci-stop-closed.yml,fork-*.yml
      # The fork needs Node 24 (package.json engines); the server's own Node is older.
      tool_setup: |
        export PATH="$HOME/.local/share/fork-sync/node-24/bin:$PATH"
        unset NODE_ENV OPENAI_API_KEY OPENROUTER_API_KEY ANTHROPIC_API_KEY CLAUDE_CODE_OAUTH_TOKEN
        export CI=true
      # The related-test check runs the tests that import a file the merge changed. A merge
      # of hundreds of upstream commits changes too many files for that to be a light check;
      # then the suite of the pull request's CI is the gate.
      light_checks: |
        [install]
        pnpm install --frozen-lockfile
        [i18n]
        pnpm i18n:check
        [contrast]
        pnpm check:contrast
        [lint]
        pnpm lint
        [typecheck]
        pnpm typecheck
        [check-electron]
        node --input-type=commonjs -e "require('electron')" && pnpm check:electron
        [vitest-related]
        count=$(wc -l < "$SYNC_CHANGED_FILES" | tr -d ' ')
        if [ "$count" -eq 0 ] || [ "$count" -gt 300 ]; then
          echo "vitest related skipped: $count changed files"
        else
          xargs pnpm exec vitest related --run --passWithNoTests < "$SYNC_CHANGED_FILES"
        fi

  # The body ends with resolve=true when it opened or updated the conflict issue.
  # A failed child run fails this node, the next node is skipped, and the issue
  # stays open: that is the pause lock.
  - id: resolve
    depends_on: [sync]
    when: "$sync.output.resolve == 'true'"
    workflow: omb-fork-upstream-resolve
    input: "Resolve the open upstream-sync-conflict issue $sync.output.issue_url"

  # The resolver merged its pull request: close the issue, lock new upstream
  # workflows and start the build. The build start is the only part of the sync
  # that the pull request merge itself does not do.
  - id: after-resolve
    depends_on: [resolve]
    when: "$resolve.output.outcome == 'merged'"
    timeout: 900000
    bash: |
      stage=after-resolve
      . "$ARTIFACTS_DIR/sync/common.sh"
      result=$resolve.output
      issue=$(state_get issue)
      merge_commit=$(jq -r '.merge_commit // ""' <<<"$result")
      pr_url=$(jq -r '.pr_url // ""' <<<"$result")
      gh issue close "$issue" --repo "$FORK" \
        --comment "Resolved by $pr_url (merge commit ${merge_commit:-unknown}). Archon starts the build. Run: $(run_url)" >/dev/null \
        || fail after-resolve "could not close issue #$issue"
      state_merge "$(jq -nc --arg c "$merge_commit" '{merge_commit: $c}')"
      if ! bash "$sync_dir/lock-workflows.sh" || ! bash "$sync_dir/start-build.sh"; then
        bash "$sync_dir/report-failure.sh" || true
        exit 1
      fi
      echo '{"issue_closed": true, "build_started": true}'
