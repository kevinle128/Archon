name: buzz-fork-upstream-sync
description: |
  Use when: The nightly launchd job (scripts/fork-sync-trigger.sh buzz) starts it through the Archon
            REST API for the codebase kevinle128/buzz. A run message of `dry-run` stops after
            the merge classification and changes nothing.
  Does: Syncs the Buzz fork with block/buzz main (fork-upstream-sync-body): ends as a no-op when
        upstream has nothing new and the fork has no unreleased commit; a clean merge goes
        through a pull request, waits for all CI checks and is merged by Archon with a merge
        commit; a conflict, a failed local check or a red CI opens the one upstream-sync-conflict
        issue and runs buzz-fork-upstream-resolve as a child run. When the pull request is
        merged, the workflows that upstream added are disabled (the workflows that are active
        on the fork today stay on) and scripts/fork-desktop-release-tag.sh of the fork tags the
        merged commit as the next desktop-v*-mf.N release; the tag push starts MF Desktop
        Build. An open upstream-sync-conflict issue pauses the sync until a human closes it.
  NOT for: Other repositories, or starting a build without a merge.

nodes:
  - id: sync
    include: fork-upstream-sync-body
    with:
      upstream_repo: block/buzz
      upstream_branch: main
      fork_repo: kevinle128/buzz
      build_workflow: mf-desktop-build.yml
      build_mode: tag-script
      release_tag_glob: desktop-v*-mf.*
      # The workflow files that are active on the fork. Only a workflow file that upstream
      # adds later is disabled.
      workflow_allowlist: _ci-*.yml,ci.yml,auto-tag-on-release-pr-merge.yml,benchmark-harbor.yml,codex-security-review.yml,desktop-release-cache-proof.yml,desktop-release-candidate.yml,docker-manual.yml,helm-chart.yml,linux-canary.yml,macos-intel-canary.yml,mesh-lifecycle.yml,mf-desktop-build.yml,minio-image.yml,promote-oss-desktop-release.yml,push-gateway-helm-chart.yml,release.yml,signed-macos-canary.yml,spec.yml,staging-dev-relay-image.yml,windows-canary.yml,fork-*.yml
      # Hermit pins the fork's Rust toolchain. PM2 sets NODE_ENV=production, which the fork
      # CI does not; unset it so a check sees the CI environment.
      tool_setup: |
        unset NODE_ENV
        # A fixed target keeps the build cache between nights; the resolver builds in its
        # own per-run target, so the two never share one.
        export CARGO_TARGET_DIR="${FORK_SYNC_CARGO_TARGET:-$HOME/.local/share/fork-sync/buzz-sync-cargo-target}"
        mkdir -p "$CARGO_TARGET_DIR"
        if [ ! -f bin/activate-hermit ]; then
          echo "tool setup: bin/activate-hermit is missing" >&2
          exit 2
        fi
        set +u
        # shellcheck disable=SC1091
        . ./bin/activate-hermit >/dev/null 2>&1 || { echo "tool setup: the Hermit environment does not activate" >&2; exit 2; }
        set -u
        command -v cargo >/dev/null 2>&1 || { echo "tool setup: cargo is missing after Hermit activation" >&2; exit 2; }
      # The body holds the shared build lock (~/.mini-desktop-build.lock) around every check.
      light_checks: |
        [rust-fmt]
        cargo fmt --all -- --check
        [rust-check]
        cargo check --workspace --all-targets --locked

  # The body ends with resolve=true when it opened or updated the conflict issue.
  # A failed child run fails this node, the next node is skipped, and the issue
  # stays open: that is the pause lock.
  - id: resolve
    depends_on: [sync]
    when: "$sync.output.resolve == 'true'"
    workflow: buzz-fork-upstream-resolve
    input: "Resolve the open upstream-sync-conflict issue $sync.output.issue_url"

  # The resolver merged its pull request: close the issue, lock new upstream
  # workflows and start the build. The build start is the only part of the sync
  # that the pull request merge itself does not do.
  - id: after-resolve
    depends_on: [resolve]
    when: "$resolve.output.outcome == 'merged'"
    timeout: 900000
    bash: |
      stage=after-resolve
      . "$ARTIFACTS_DIR/sync/common.sh"
      result=$resolve.output
      issue=$(state_get issue)
      merge_commit=$(jq -r '.merge_commit // ""' <<<"$result")
      pr_url=$(jq -r '.pr_url // ""' <<<"$result")
      if [ -z "$merge_commit" ] && [ -n "$pr_url" ]; then
        merge_commit=$(gh pr view "$pr_url" --json mergeCommit -q '.mergeCommit.oid // empty' || true)
      fi
      gh issue close "$issue" --repo "$FORK" \
        --comment "Resolved by $pr_url (merge commit ${merge_commit:-unknown}). Archon starts the build. Run: $(run_url)" >/dev/null \
        || fail after-resolve "could not close issue #$issue"
      state_merge "$(jq -nc --arg c "$merge_commit" '{merge_commit: $c}')"
      if ! bash "$sync_dir/lock-workflows.sh" || ! bash "$sync_dir/start-build.sh"; then
        bash "$sync_dir/report-failure.sh" || true
        exit 1
      fi
      echo '{"issue_closed": true, "build_started": true}'
